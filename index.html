<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>ลงทะเบียนเข้างานสัมมนา</title><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
/* Layout: single mobile column — sticky counter, big scan action, result slip, roster list */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16211E; --muted:#5E6B67; --line:#D9DFDC;
  --accent:#1F5C4F; --accent-ink:#FFFFFF; --accent-soft:#E2EEEA;
  --ok:#1E7A46; --ok-soft:#E3F3E9; --warn:#A35F00; --warn-soft:#FBF0DD; --bad:#B42318; --bad-soft:#FCE8E6;
  --font:"IBM Plex Sans Thai",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --ink:#E7EEEB; --muted:#9AA8A3; --line:#2A3632;
  --accent:#6CC3AC; --accent-ink:#0C1412; --accent-soft:#1D332D;
  --ok:#5CD08E; --ok-soft:#173225; --warn:#F0B354; --warn-soft:#352812; --bad:#FF8A7E; --bad-soft:#3A1A17; color-scheme:dark}}
:root.never{
  --bg:#0F1614; --surface:#18221F; --ink:#E7EEEB; --muted:#9AA8A3; --line:#2A3632;
  --accent:#6CC3AC; --accent-ink:#0C1412; --accent-soft:#1D332D;
  --ok:#5CD08E; --ok-soft:#173225; --warn:#F0B354; --warn-soft:#352812; --bad:#FF8A7E; --bad-soft:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;display:flex;flex-direction:column;gap:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:28px;white-space:nowrap}
.count small{font-size:15px;font-weight:500;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.status{font-size:12.5px;color:var(--muted);margin-top:6px}
.status.err{color:var(--bad)}
.scan{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.btn{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:14px 16px;font-weight:600}
.btn:focus-visible,.row:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);font-size:19px;padding:20px 16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.primary svg{width:26px;height:26px}
.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
#cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px}
#cam .close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:20px;padding:8px 14px;font:inherit;font-size:14px}
.slip{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.slip.ok{background:var(--ok-soft);border-color:var(--ok)}
.slip.dup{background:var(--warn-soft);border-color:var(--warn)}
.slip.bad{background:var(--bad-soft);border-color:var(--bad)}
.slip .tag{font-size:13px;font-weight:700;letter-spacing:.04em}
.slip.ok .tag{color:var(--ok)}.slip.dup .tag{color:var(--warn)}.slip.bad .tag{color:var(--bad)}
.slip .nm{font-size:22px;font-weight:700;line-height:1.25}
.slip .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.slip .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-direction:column;gap:10px}
input[type=search]{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;cursor:default}
.row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.row.in .dot{background:var(--ok);border-color:var(--ok)}
.row .who{min-width:0}
.row .n{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.row .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.row:not(.in) .t{color:var(--muted);font-weight:400;font-size:13px}
.act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.act .btn{padding:10px 14px;font-size:14px}
.act .warnb{background:var(--bad-soft);color:var(--bad)}
.act .okb{background:var(--ok);color:var(--accent-ink)}
.empty{padding:20px;color:var(--muted);text-align:center}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{flex:1;min-width:150px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>[hidden]{display:none!important}body{margin:0}.gatebox{display:flex;flex-direction:column;gap:14px;padding-top:40px}#gform{display:flex;flex-direction:column;gap:12px}#gcode{font:inherit;font-size:20px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.3em}</style></head><body>
<div id="app"><div class="wrap">
  <header>
    <div class="hrow"><h1>ลงทะเบียนเข้างานสัมมนา</h1><div class="count" id="count">0<small> / 0</small></div></div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="status" id="status">กำลังโหลด…</div>
  </header>

  <section class="scan" aria-label="สแกน">
    <button class="btn primary" id="scanBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
      เปิดกล้องสแกน
    </button>
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    <div id="cam" hidden><video id="video" playsinline muted></video><div class="frame"></div><button class="close" id="camClose" type="button">ปิดกล้อง</button></div>
    <p class="hint" id="scanHint">กดเปิดกล้องครั้งเดียว แล้วส่องบัตรทีละใบ ระบบบันทึกเวลาเข้างานให้อัตโนมัติ</p>
  </section>

  <div id="result" aria-live="polite"></div>

  <section class="tools" aria-label="รายชื่อ">
    <input type="search" id="q" placeholder="ค้นหาชื่อ หรือรหัส (เช่น 012)" autocomplete="off">
    <div class="chips" role="group" aria-label="ตัวกรอง">
      <button class="chip" data-f="all" aria-pressed="true" type="button">ทั้งหมด</button>
      <button class="chip" data-f="in" aria-pressed="false" type="button">เข้างานแล้ว</button>
      <button class="chip" data-f="out" aria-pressed="false" type="button">ยังไม่มา</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <div class="foot" hidden><button class="btn ghost" id="logout" type="button"></button></div>
</div>

</div>
<script>
let CODE='';
let people=[], filter='all', openId=null, busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setStatus(t,err){const s=$('#status');s.textContent=t;s.classList.toggle('err',!!err)}
const API='https://script.google.com/macros/s/AKfycbxuK07fZtTBTKALd0WOpP2QJ4poNaTdw3lrt6j71bLJ9VLEY9rR8EC-nGEHgYpG2upDXA/exec';
async function api(params){
  const u=API+'?'+new URLSearchParams(Object.assign({t:Date.now()},params));
  const r=await fetch(u,{redirect:'follow'}); const j=await r.json();
  if(!j.ok)throw new Error(j.error||'error'); return j;
}
const call=async(fn,...args)=>{
  if(fn==='getData')return (await api({action:'list'})).people;
  if(fn==='checkIn')return api({action:'checkin',id:args[0],method:args[1]});
  if(fn==='undo')return api({action:'undo',id:args[0]});
};
function badCode(e){return String(e&&e.message||e).includes('BAD_CODE')}

function render(){
  const n=people.filter(p=>p.at).length,tot=people.length;
  $('#count').innerHTML=n+'<small> / '+tot+'</small>';
  $('#barfill').style.width=(tot?n/tot*100:0)+'%';
  const q=$('#q').value.trim().toLowerCase();
  let rows=people.filter(p=>{if(filter==='in'&&!p.at)return false;if(filter==='out'&&p.at)return false;
    return !q||p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)});
  if(filter==='in')rows=rows.slice().sort((a,b)=>b.at-a.at);
  $('#list').innerHTML=rows.length?rows.map(p=>{
    return `<div class="row ${p.at?'in':''}"><span class="dot"></span><span class="who"><div class="n">${esc(p.name)}</div><div class="s">${p.id} · PIN ${esc(p.pin)}</div></span><span class="t">${p.at?p.time:'ยังไม่มา'}</span></div>`;
  }).join(''):'<div class="empty">ไม่พบรายชื่อที่ตรงกัน</div>';
}
function showResult(kind,p,extra){
  const tags={ok:'ลงทะเบียนสำเร็จ',dup:'ลงทะเบียนไปแล้ว',bad:'สแกนไม่สำเร็จ'};
  let body=p?`<div class="nm">${esc(p.name)}</div><div class="meta"><span>PIN <b>${esc(p.pin)}</b></span><span>รหัส <b>${p.id}</b></span>${p.time?`<span>เวลาเข้างาน <b>${p.time} น.</b></span>`:''}</div>`:'';
  if(extra)body+=`<div class="meta">${esc(extra)}</div>`;
  $('#result').innerHTML=`<div class="slip ${kind}"><div class="tag">${tags[kind]}</div>${body}</div>`;
  try{navigator.vibrate&&navigator.vibrate(kind==='ok'?80:[60,60,60])}catch(e){}
}
function merge(p){const i=people.findIndex(x=>x.id===p.id);if(i>=0)people[i]=p;render()}
let saving=false;
async function checkIn(id,method){saving=true;try{return await checkIn_(id,method)}finally{setTimeout(()=>saving=false,1500)}}
async function checkIn_(id,method){
  $('#result').innerHTML='<div class="slip"><div class="tag">กำลังบันทึก…</div></div>';
  try{const r=await call('checkIn',id,method);
    if(r.status==='unknown'){showResult('bad',null,'QR นี้ไม่ใช่บัตรของงานนี้ ('+r.id+')');return}
    merge(r.person);showResult(r.status,r.person);
  }catch(e){showResult('bad',null,'บันทึกไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองอีกครั้ง')}
}
async function undo(id){try{await call('undo',id);openId=null;$('#result').innerHTML='';await refresh()}catch(e){setStatus('ยกเลิกไม่สำเร็จ',true)}}
async function refresh(){
  if(busy)return;busy=true;
  try{people=await call('getData');setStatus('ออนไลน์ · บันทึกลง Google Sheet');render()}
  catch(e){setStatus('เชื่อมต่อไม่ได้ กำลังลองใหม่…',true)}
  finally{busy=false}
}

/* QR */
function decodeCanvas(c){const d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
  const r=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});return r&&r.data?r.data.trim():null}
async function decodeFile(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const max of [1000,1600,700]){const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const r=decodeCanvas(c);if(r)return r}return null}finally{URL.revokeObjectURL(url)}}
$('#photo').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  $('#result').innerHTML='<div class="slip"><div class="tag">กำลังอ่าน QR…</div></div>';
  const code=await decodeFile(f).catch(()=>null);
  if(!code){showResult('bad',null,'อ่าน QR ไม่ได้ ลองถ่ายใหม่ให้ QR อยู่กลางภาพและไม่เบลอ');return}
  checkIn(code,'scan')});
let stream=null,live=false,raf=0,lastCode='',lastAt=0,liveOk=null;
async function startLive(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  const v=$('#video');v.srcObject=stream;await v.play();$('#cam').hidden=false;live=true;const c=document.createElement('canvas');
  let bd=null;try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))bd=new BarcodeDetector({formats:['qr_code']})}catch(e){bd=null}
  const tick=async()=>{if(!live)return;if(v.videoWidth&&!saving){
    if(bd){try{const r=await bd.detect(v);const code=r[0]&&r[0].rawValue&&r[0].rawValue.trim();const now=Date.now();
      if(code&&(code!==lastCode||now-lastAt>5000)){lastCode=code;lastAt=now;checkIn(code,'scan')}}catch(e){bd=null}raf=requestAnimationFrame(tick);return}const s=Math.min(1,640/v.videoWidth);c.width=v.videoWidth*s|0;c.height=v.videoHeight*s|0;
    c.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,c.width,c.height);const code=decodeCanvas(c);const now=Date.now();
    if(code&&(code!==lastCode||now-lastAt>5000)){lastCode=code;lastAt=now;checkIn(code,'scan')}}raf=requestAnimationFrame(tick)};tick()}
function stopLive(){$('#scanBtn').hidden=false;live=false;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#cam').hidden=true}
$('#camClose').addEventListener('click',stopLive);
$('#scanBtn').addEventListener('click',async()=>{if(live)return;
  if(liveOk!==false){try{await startLive();liveOk=true;$('#scanHint').textContent='ส่องบัตรทีละใบ ไม่ต้องกดอะไร (สแกนบัตรเดิมซ้ำได้หลังผ่านไป 5 วินาที)';$('#scanBtn').hidden=true;return}catch(e){liveOk=false}}
  $('#photo').click()});

$('#q').addEventListener('input',render);
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));

let timer=0;
function start(){setStatus('กำลังโหลดรายชื่อ…');refresh();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)refresh()},10000)}
start();
</script>
</body></html>
